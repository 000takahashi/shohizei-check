<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ページが見つかりません｜消費税1%チェッカー</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f7f9;--paper:#fff;--ink:#101828;--ink-2:#344054;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b1017;--paper:#131b26;--ink:#f1f5f9;--ink-2:#cbd5e1;--muted:#94a3b8;--line:#233042;--accent:#60a5fa;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-size:16px;line-height:1.8;display:flex;flex-direction:column}
header{border-bottom:1px solid var(--line);background:var(--paper)}
.bar{max-width:880px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:700;letter-spacing:.05em}
.brand img{width:32px;height:32px;border-radius:8px}
main{flex:1;max-width:880px;width:100%;margin:0 auto;padding:48px 20px 64px}
.code{margin:0 0 6px;color:var(--muted);font-size:.85rem;letter-spacing:.12em}
h1{margin:0 0 12px;font-size:1.6rem;line-height:1.4}
p{margin:0 0 1em;color:var(--ink-2)}
ul{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:10px;max-width:480px}
li a{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:12px 16px;background:var(--paper);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600}
li a:hover{border-color:var(--accent);color:var(--accent)}
li a span{color:var(--muted);font-weight:400;font-size:.85rem}
li:first-child a{background:var(--accent);border-color:var(--accent);color:#fff}
li:first-child a span{color:#fff;opacity:.85}
@media (prefers-color-scheme:dark){li:first-child a,li:first-child a span{color:#0b1017}}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:20px}
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="/"><img src="/favicon.svg" alt="" width="32" height="32">消費税1%チェッカー</a></div></header>
<main>
<p class="code">404</p>
<h1>このページは見つかりませんでした</h1>
<p>アドレスが間違っているか、ページの場所が変わった可能性があります。お手数ですが、下のどれかからお進みください。</p>
<ul>
<li><a href="/">納める消費税を試算する<span>トップ</span></a></li>
<li><a href="/guide/">解説を読む<span>解説</span></a></li>
<li><a href="/guide/faq/">よくある質問<span>質問</span></a></li>
<li><a href="/#about">運営者・お問い合わせ<span>運営者</span></a></li>
</ul>

</main>
<footer>消費税1%チェッカー</footer>
</body>
</html>

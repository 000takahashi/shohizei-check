name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --test tests/calc.test.js tests/seo.test.js tests/csv.test.js tests/ics.test.js tests/year.test.js tests/paid.test.mjs tests/pass.test.mjs
